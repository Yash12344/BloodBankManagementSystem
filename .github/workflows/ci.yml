name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bloodline
          POSTGRES_PASSWORD: bloodline
          POSTGRES_DB: bloodline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bloodline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://bloodline:bloodline@localhost:5432/bloodline_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-0123456789
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        # Switch to --frozen-lockfile once pnpm-lock.yaml is committed (run `pnpm install`
        # in a networked dev env to generate it).
        run: pnpm install --no-frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Sync schema to test database
        # Phase 1 uses `db push` to materialize the schema (no migration files yet).
        # Replace with `db:migrate:deploy` once the initial migration is committed.
        # Call the package script directly (not the dotenv-cli-wrapped root script): CI
        # injects DATABASE_URL through the job env, so Prisma reads it straight from the
        # environment with no .env file involved.
        run: pnpm --filter @bloodline/db push

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
