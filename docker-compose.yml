services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bloodline
      POSTGRES_PASSWORD: bloodline
      POSTGRES_DB: bloodline
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloodline"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    # Phase 1: `db push` materializes the schema. Switch to `migrate:deploy` once an
    # initial migration is committed (run `pnpm db:migrate` in a dev env to create it).
    command: sh -c "pnpm --filter @bloodline/db push && node apps/api/dist/server.js"
    environment:
      NODE_ENV: production
      API_PORT: 4000
      APP_BASE_URL: http://localhost:3000
      DATABASE_URL: postgresql://bloodline:bloodline@postgres:5432/bloodline?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"

  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: node apps/api/dist/worker.js
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://bloodline:bloodline@postgres:5432/bloodline?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:4000
    depends_on:
      - api
    ports:
      - "3000:3000"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - web
      - api

volumes:
  pgdata:
