# Nginx reverse proxy: routes API traffic to the backend and everything else to the
# Next.js web app. TLS termination is added at the edge in production.
upstream bloodline_api {
  server api:4000;
}
upstream bloodline_web {
  server web:3000;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 10m;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml;

  # Health/readiness probes and the versioned API go to the backend.
  location /api/ {
    proxy_pass http://bloodline_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /health {
    proxy_pass http://bloodline_api;
  }
  location = /ready {
    proxy_pass http://bloodline_api;
  }

  # Everything else is the web app.
  location / {
    proxy_pass http://bloodline_web;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
